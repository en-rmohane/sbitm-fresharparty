<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="stampGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5" />
      <stop offset="35%" stop-color="#E5C173" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8F6A26" />
    </linearGradient>
    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#stampShadow)" transform="rotate(-6 160 90)">
    <!-- Outer Double Border Box with Rounded Notches -->
    <rect x="10" y="10" width="300" height="160" rx="14" fill="#641E28" fill-opacity="0.92" stroke="url(#stampGold)" stroke-width="4.5" />
    <rect x="18" y="18" width="284" height="144" rx="10" fill="none" stroke="url(#stampGold)" stroke-width="1.8" stroke-dasharray="7,4" />

    <!-- Corner Little Rosettes -->
    <circle cx="28" cy="28" r="4" fill="url(#stampGold)" />
    <circle cx="292" cy="28" r="4" fill="url(#stampGold)" />
    <circle cx="28" cy="152" r="4" fill="url(#stampGold)" />
    <circle cx="292" cy="152" r="4" fill="url(#stampGold)" />

    <!-- Header text -->
    <text x="160" y="44" 
          font-family="'Cinzel', serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="url(#stampGold)">
      FACULTY BLESSING RECEIVED
    </text>

    <!-- Star Line -->
    <text x="160" y="60" font-family="sans-serif" font-size="10" letter-spacing="6" text-anchor="middle" fill="#FFE8B5">
      ★ ★ ★ ★ ★
    </text>

    <!-- Main Stamp Word -->
    <text x="160" y="108" 
          font-family="'Cinzel', 'Playfair Display', serif" 
          font-size="38" 
          font-weight="900" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="url(#stampGold)" 
          stroke="#3A1019" 
          stroke-width="1.2">
      APPROVED
    </text>

    <!-- Subtitle / College -->
    <text x="160" y="132" 
          font-family="'Cinzel', serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#FFF8EB">
      SANSKRITI 2026 DIGITAL SEAL
    </text>

    <!-- Disclaimer Subtext -->
    <text x="160" y="150" 
          font-family="'Poppins', sans-serif" 
          font-size="8.5" 
          font-weight="400" 
          text-anchor="middle" 
          fill="#F5EBD9" 
          opacity="0.8">
      Acknowledge &amp; Welcomed • Internal College Invitation
    </text>
  </g>
</svg>

