<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <defs>
    <linearGradient id="diyaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#7B5B20" />
    </linearGradient>
    <radialGradient id="flameInner" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="40%" stop-color="#FFE600" />
      <stop offset="75%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#DD2C00" />
    </radialGradient>
    <filter id="flameGlow">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Diya Clay / Brass Vessel -->
  <path d="M 15 48 C 22 72 78 72 85 48 C 76 54 24 54 15 48 Z" fill="url(#diyaGold)" stroke="#6B4E1B" stroke-width="1.5" />
  <!-- Vessel Rim and Details -->
  <ellipse cx="50" cy="48" rx="35" ry="7" fill="#641E28" stroke="url(#diyaGold)" stroke-width="1.2" />
  
  <!-- Vessel Decorative Dots -->
  <circle cx="35" cy="56" r="1.5" fill="#FFE8B5" />
  <circle cx="50" cy="58" r="2" fill="#FFE8B5" />
  <circle cx="65" cy="56" r="1.5" fill="#FFE8B5" />

  <!-- Diya Flame Base Glow -->
  <ellipse cx="50" cy="40" rx="12" ry="16" fill="#FFA000" opacity="0.3" filter="url(#flameGlow)" />
  
  <!-- Living Flame -->
  <path d="M 50 10 C 42 24 38 34 45 44 C 47 46 53 46 55 44 C 62 34 58 24 50 10 Z" fill="url(#flameInner)" filter="url(#flameGlow)" />
  
  <!-- Flame Core -->
  <path d="M 50 22 C 46 29 44 35 47 42 C 49 44 51 44 53 42 C 56 35 54 29 50 22 Z" fill="#FFFFFF" opacity="0.9" />
</svg>

