<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#916E2E" />
    </linearGradient>
  </defs>

  <g stroke="url(#mandalaGold)" fill="none" stroke-width="1.2" opacity="0.35" transform="translate(200, 200)">
    <!-- Central circles -->
    <circle r="12" />
    <circle r="24" stroke-dasharray="3,3" />
    <circle r="40" />
    <circle r="70" />
    <circle r="110" stroke-dasharray="4,4" />
    <circle r="150" />
    <circle r="185" stroke-dasharray="2,6" />

    <!-- 12 Petals Layer 1 -->
    <g id="petals12">
      <!-- 12 Rotated Petals -->
      <path d="M 0,-40 C 12,-55 12,-65 0,-70 C -12,-65 -12,-55 0,-40 Z" />
      <path d="M 0,-70 C 20,-90 20,-105 0,-110 C -20,-105 -20,-90 0,-70 Z" />
      <circle cx="0" cy="-60" r="2.5" fill="url(#mandalaGold)" />
      <circle cx="0" cy="-100" r="3" fill="url(#mandalaGold)" />
    </g>
    <use href="#petals12" transform="rotate(30)" />
    <use href="#petals12" transform="rotate(60)" />
    <use href="#petals12" transform="rotate(90)" />
    <use href="#petals12" transform="rotate(120)" />
    <use href="#petals12" transform="rotate(150)" />
    <use href="#petals12" transform="rotate(180)" />
    <use href="#petals12" transform="rotate(210)" />
    <use href="#petals12" transform="rotate(240)" />
    <use href="#petals12" transform="rotate(270)" />
    <use href="#petals12" transform="rotate(300)" />
    <use href="#petals12" transform="rotate(330)" />

    <!-- Outer Lotus Crests -->
    <g id="crest24">
      <path d="M 0,-150 Q 15,-170 0,-185 Q -15,-170 0,-150 Z" />
      <circle cx="0" cy="-185" r="2" fill="url(#mandalaGold)" />
    </g>
    <use href="#crest24" transform="rotate(15)" />
    <use href="#crest24" transform="rotate(45)" />
    <use href="#crest24" transform="rotate(75)" />
    <use href="#crest24" transform="rotate(105)" />
    <use href="#crest24" transform="rotate(135)" />
    <use href="#crest24" transform="rotate(165)" />
    <use href="#crest24" transform="rotate(195)" />
    <use href="#crest24" transform="rotate(225)" />
    <use href="#crest24" transform="rotate(255)" />
    <use href="#crest24" transform="rotate(285)" />
    <use href="#crest24" transform="rotate(315)" />
    <use href="#crest24" transform="rotate(345)" />
  </g>
</svg>

