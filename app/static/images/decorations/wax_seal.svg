<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sealGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFEBB8" />
      <stop offset="25%" stop-color="#E5C173" />
      <stop offset="60%" stop-color="#C6A15B" />
      <stop offset="85%" stop-color="#8F6A26" />
      <stop offset="100%" stop-color="#5E4314" />
    </radialGradient>
    <radialGradient id="waxBase" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8A2635" />
      <stop offset="45%" stop-color="#641E28" />
      <stop offset="80%" stop-color="#3A1019" />
      <stop offset="100%" stop-color="#24070D" />
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Organic Melted Wax Outer Edge -->
    <path d="M 100,10 
             C 120,8 140,16 155,28 
             C 172,42 185,62 188,84 
             C 192,108 184,132 170,152 
             C 156,170 134,185 110,188 
             C 86,191 62,183 45,170 
             C 26,155 12,132 10,108 
             C 8,84 20,60 38,42 
             C 54,26 78,12 100,10 Z" 
          fill="url(#waxBase)" stroke="#50141D" stroke-width="3"/>

    <!-- Concentric Gold Imprint Ring -->
    <circle cx="100" cy="100" r="70" fill="url(#waxBase)" stroke="url(#sealGold)" stroke-width="3" />
    <circle cx="100" cy="100" r="64" fill="none" stroke="url(#sealGold)" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Circular Rim Text / Beads -->
    <circle cx="100" cy="38" r="2.5" fill="url(#sealGold)" />
    <circle cx="162" cy="100" r="2.5" fill="url(#sealGold)" />
    <circle cx="100" cy="162" r="2.5" fill="url(#sealGold)" />
    <circle cx="38" cy="100" r="2.5" fill="url(#sealGold)" />
    
    <circle cx="144" cy="56" r="2" fill="url(#sealGold)" />
    <circle cx="144" cy="144" r="2" fill="url(#sealGold)" />
    <circle cx="56" cy="144" r="2" fill="url(#sealGold)" />
    <circle cx="56" cy="56" r="2" fill="url(#sealGold)" />

    <!-- Center Emblem: Devanagari 'सं' and '2026' -->
    <text x="100" y="105" 
          font-family="'Noto Sans Devanagari', 'Cinzel', serif" 
          font-size="44" 
          font-weight="700" 
          text-anchor="middle" 
          dominant-baseline="middle" 
          fill="url(#sealGold)" 
          stroke="#422E0C" 
          stroke-width="1">
      सं
    </text>
    
    <text x="100" y="138" 
          font-family="'Cinzel', serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="url(#sealGold)">
      2026
    </text>

    <!-- Top Diya Ray in Seal -->
    <path d="M 96,62 Q 100,52 104,62 Q 100,58 96,62 Z" fill="url(#sealGold)" />
  </g>
</svg>

