<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="35%" stop-color="#DFBA73" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#916E2E" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#641E28" />
      <stop offset="100%" stop-color="#3A1019" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Kalash / Diya Motif -->
  <g transform="translate(15, 10)">
    <!-- Outer Sacred Circle with Ornaments -->
    <circle cx="50" cy="50" r="46" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" />
    
    <!-- Radiant Lotus Petals Base -->
    <path d="M 50 18 C 55 28 65 35 75 38 C 65 42 58 48 50 58 C 42 48 35 42 25 38 C 35 35 45 28 50 18 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Diya Base Lamp -->
    <path d="M 28 62 C 32 78 68 78 72 62 C 65 67 35 67 28 62 Z" fill="url(#goldGrad)" />
    
    <!-- Eternal Flame -->
    <path d="M 50 40 C 44 48 42 54 46 62 C 50 62 54 62 54 62 C 58 54 56 48 50 40 Z" fill="#D97732" />
    <path d="M 50 45 C 47 50 46 54 48 59 C 50 59 52 59 52 59 C 54 54 53 50 50 45 Z" fill="#FFE57F" filter="url(#goldGlow)" />
    
    <!-- Micro Dots Around -->
    <circle cx="50" cy="10" r="2.5" fill="url(#goldGrad)" />
    <circle cx="90" cy="50" r="2.5" fill="url(#goldGrad)" />
    <circle cx="50" cy="90" r="2.5" fill="url(#goldGrad)" />
    <circle cx="10" cy="50" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 25)">
    <!-- College Tagline -->
    <text x="0" y="20" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#C6A15B">
      SHRI BALAJI INSTITUTE OF TECHNOLOGY
    </text>
    
    <!-- Main Sanskriti Festival Brand -->
    <text x="0" y="58" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="800" letter-spacing="4" fill="url(#goldGrad)" filter="url(#goldGlow)">
      SANSKRITI
    </text>
    <text x="260" y="58" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="300" letter-spacing="3" fill="#D97732">
      2026
    </text>

    <!-- Subtitle -->
    <text x="0" y="78" font-family="'Poppins', sans-serif" font-size="11" font-weight="400" letter-spacing="2.5" fill="#FFF8EB" opacity="0.85">
      DIGITAL FRESHERS INVITATION &amp; FACULTY BLESSINGS
    </text>
  </g>
</svg>

