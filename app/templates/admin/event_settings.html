{% extends "base.html" %}

{% block title %}Event Configuration – Sanskriti 2026 Admin{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="mb-3">
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-gold-outline btn-sm">
      <i data-lucide="arrow-left" style="width: 14px;"></i> Back to Command Center
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10 col-xl-9">

      <div class="festive-card p-4 p-md-5">
        <div class="ornament-corner-tl"></div>
        <div class="ornament-corner-tr"></div>

        <div class="d-flex align-items-center gap-3 mb-4 border-bottom border-gold pb-3">
          <div class="dept-icon-wrapper mb-0" style="width: 50px; height: 50px;">
            <i data-lucide="sliders"></i>
          </div>
          <div>
            <h3 class="heading-cinzel text-gold fw-bold mb-0">EVENT CONFIGURATION</h3>
            <span class="text-cream opacity-75 small">Customize live festival details, date, venue, and royal invitation text</span>
          </div>
        </div>

        <form method="POST" action="{{ url_for('admin.event_settings') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label class="form-label text-gold-light small fw-bold text-uppercase">Event Title</label>
              <input type="text" name="title" class="form-control form-sanskriti" value="{{ event.title }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label text-gold-light small fw-bold text-uppercase">College Short Name</label>
              <input type="text" name="college_short_name" class="form-control form-sanskriti" value="{{ event.college_short_name }}" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-gold-light small fw-bold text-uppercase">College Full Name</label>
            <input type="text" name="college_name" class="form-control form-sanskriti" value="{{ event.college_name }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-gold-light small fw-bold text-uppercase">Event Tagline</label>
            <input type="text" name="tagline" class="form-control form-sanskriti" value="{{ event.tagline }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-gold-light small fw-bold text-uppercase">Supporting Narrative / Message</label>
            <textarea name="supporting_message" class="form-control form-sanskriti" rows="3" required>{{ event.supporting_message }}</textarea>
          </div>

          <div class="mb-3">
            <label class="form-label text-gold-light small fw-bold text-uppercase">Core Invitation Text (On Digital Card)</label>
            <textarea name="invitation_text" class="form-control form-sanskriti" rows="3" required>{{ event.invitation_text }}</textarea>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label text-gold-light small fw-bold text-uppercase">Event Date</label>
              <input type="text" name="event_date" class="form-control form-sanskriti" value="{{ event.event_date }}" required placeholder="e.g. November 19, 2026">
            </div>

            <div class="col-md-4">
              <label class="form-label text-gold-light small fw-bold text-uppercase">Event Time</label>
              <input type="text" name="event_time" class="form-control form-sanskriti" value="{{ event.event_time }}" required placeholder="e.g. 10:00 AM onwards">
            </div>

            <div class="col-md-4">
              <label class="form-label text-gold-light small fw-bold text-uppercase">Venue</label>
              <input type="text" name="venue" class="form-control form-sanskriti" value="{{ event.venue }}" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-gold-light small fw-bold text-uppercase">Organizing Committee Details</label>
            <input type="text" name="organizer_details" class="form-control form-sanskriti" value="{{ event.organizer_details }}" required>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-gold-outline">Cancel</a>
            <button type="submit" class="btn btn-gold">
              <i data-lucide="save" style="width: 16px;"></i> Save Event Configuration
            </button>
          </div>
        </form>

      </div>

    </div>
  </div>
</div>
{% endblock %}
